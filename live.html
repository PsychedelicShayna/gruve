<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Live voice board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e15;color:#dce5f2;font:14px system-ui;overflow:hidden}svg{width:100vw;height:100vh;touch-action:none;background:radial-gradient(ellipse at center,#18202d,#090c12)}header{position:fixed;top:18px;left:22px;pointer-events:none}header b{letter-spacing:2px;font-size:13px}#status{margin-left:20px;color:#92dcb1;font-size:12px}button{position:fixed;right:22px;top:16px;background:#202b3b;border:1px solid #40506a;border-radius:8px;color:#dce5f2;padding:8px 14px;cursor:pointer}.object{cursor:grab}.object.born{animation:appear .25s ease-out}.object{transition:opacity .18s} @keyframes appear{from{opacity:0}to{opacity:1}}.card{height:100%;padding:15px;color:#e2e9f3;white-space:pre-wrap;overflow:auto;font:14px/1.5 system-ui}.card strong{display:block;margin-bottom:8px}.card pre{margin:0;font:13px/1.5 monospace;white-space:pre-wrap}footer{position:fixed;bottom:16px;left:22px;color:#6d7d94;font-size:12px;pointer-events:none}
</style>
<header><b>LIVE BOARD</b><span id="status">connecting</span></header><button onclick="fit()">Fit board</button>
<svg id="canvas"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a3afc3"/></marker></defs><g id="world"></g></svg>
<footer>Speak to add, change, connect or remove · drag to arrange · wheel to zoom</footer>
<script>
const NS='http://www.w3.org/2000/svg', world=document.getElementById('world'), canvas=document.getElementById('canvas'), statusEl=document.getElementById('status');
const objects=new Map(), elements=new Map();let view={x:innerWidth/2,y:innerHeight/2,z:1},drag=null,lastSeq=0;
function svg(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function transform(){world.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.z})`)}transform();
function bounds(o){return {x:o.x||0,y:o.y||0,w:o.width||(o.type==='dot'?14:260),h:o.height||(o.type==='dot'?14:130)}}
function draw(id){
 const o=objects.get(id);if(!o)return;let g=elements.get(id);if(!g){g=svg('g',{'data-id':id,class:'object born'});elements.set(id,g);world.appendChild(g)}g.replaceChildren();
 let {x,y,w,h}=bounds(o),color=o.color||'#94b8ff';g.setAttribute('transform',`translate(${x} ${y})`);
 if(o.type==='dot'||o.type==='ellipse'){g.append(svg('ellipse',{cx:w/2,cy:h/2,rx:w/2,ry:h/2,fill:o.fill||color,stroke:color}));}
 else if(['line','arrow','edge'].includes(o.type)){
 const a=objects.get(o.from),b=objects.get(o.to);let x1=0,y1=0,x2=o.x2||100,y2=o.y2||0;
 if(a&&b){const aa=bounds(a),bb=bounds(b);x1=aa.x+aa.w/2;y1=aa.y+aa.h/2;x2=bb.x+bb.w/2;y2=bb.y+bb.h/2;g.removeAttribute('transform')}
 g.append(svg('line',{x1,y1,x2,y2,stroke:color,'stroke-width':o.strokeWidth||2,...(o.type==='arrow'?{'marker-end':'url(#arrow)'}:{})}));if(o.text){let t=svg('text',{x:(x1+x2)/2,y:(y1+y2)/2-10,fill:color,'text-anchor':'middle'});t.textContent=o.text;g.append(t)}world.prepend(g);
 }else if(o.type==='group'){
 const members=(o.members||[]).map(id=>objects.get(id)).filter(Boolean).map(bounds);
 if(members.length){x=Math.min(...members.map(b=>b.x))-25;y=Math.min(...members.map(b=>b.y))-35;w=Math.max(...members.map(b=>b.x+b.w))-x+25;h=Math.max(...members.map(b=>b.y+b.h))-y+25;g.setAttribute('transform',`translate(${x} ${y})`)}
 g.append(svg('rect',{width:w,height:h,rx:18,fill:'none',stroke:color,'stroke-width':2,'stroke-dasharray':'8 5'}));const t=svg('text',{x:12,y:-10,fill:color});t.textContent=o.text||'';g.append(t);world.prepend(g);
 }else{
 if(o.type!=='text')g.append(svg('rect',{width:w,height:h,rx:o.type==='rectangle'?3:14,fill:o.fill||'#1b2433',stroke:color,'stroke-width':1.5}));
 const fo=svg('foreignObject',{width:w,height:h});const div=document.createElement('div');div.className='card';if(o.title){const title=document.createElement('strong');title.textContent=o.title;div.append(title)}const body=document.createElement(o.type==='code'?'pre':'div');body.textContent=o.text||'';div.append(body);fo.append(div);g.append(fo);
 }
}
function dependencies(){for(const [id,o]of objects)if(o.from||o.members)draw(id)}
function apply(c){if(c.op==='create'){objects.set(c.id,{type:'card',...c});draw(c.id)}if(c.op==='update'&&objects.has(c.id)){Object.assign(objects.get(c.id),c);draw(c.id)}if(c.op==='remove'){objects.delete(c.id);elements.get(c.id)?.remove();elements.delete(c.id);for(const [id,o]of objects)if(o.from===c.id||o.to===c.id){objects.delete(id);elements.get(id)?.remove();elements.delete(id)}}if(c.op==='clear'){objects.clear();elements.clear();world.replaceChildren()}if(c.op==='fit')fit();dependencies();}
function fit(){const box=world.getBBox();if(!box.width)return;view.z=Math.min(1.3,(innerWidth-120)/box.width,(innerHeight-140)/box.height);view.x=innerWidth/2-(box.x+box.width/2)*view.z;view.y=innerHeight/2-(box.y+box.height/2)*view.z;transform()}
async function command(c){return fetch('/commands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)})}
const stream=new EventSource('/events');stream.onopen=()=>statusEl.textContent='connected · live';stream.onerror=()=>statusEl.textContent='reconnecting';
stream.onmessage=e=>{const c=JSON.parse(e.data);if(c.seq<=lastSeq)return;apply(c);lastSeq=c.seq;statusEl.textContent=`live · ${objects.size} objects`;fetch('/ack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seq:lastSeq})});};
canvas.onpointerdown=e=>{const id=e.target.closest('[data-id]')?.dataset.id,o=objects.get(id);drag={id,sx:e.clientX,sy:e.clientY,x:o?o.x||0:view.x,y:o?o.y||0:view.y};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(drag.id){const o=objects.get(drag.id);o.x=drag.x+dx/view.z;o.y=drag.y+dy/view.z;draw(drag.id);dependencies()}else{view.x=drag.x+dx;view.y=drag.y+dy;transform()}};
canvas.onpointerup=()=>{if(drag?.id){const o=objects.get(drag.id);command({op:'update',id:drag.id,x:o.x,y:o.y})}drag=null};canvas.onpointercancel=()=>drag=null;
canvas.onwheel=e=>{e.preventDefault();const z=Math.max(.1,Math.min(4,view.z*Math.exp(-e.deltaY*.001)));view.x=e.clientX-(e.clientX-view.x)*z/view.z;view.y=e.clientY-(e.clientY-view.y)*z/view.z;view.z=z;transform()};
</script></html>
