<!doctype html><html><body><pre id="results">RUNNING</pre><iframe src="/" style="width:1100px;height:700px"></iframe><script type="module">
const results=[],frame=document.querySelector('iframe'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,label)=>{if(!ok)throw Error(label);results.push('PASS '+label);};
async function ready(){for(let i=0;i<100;i++){if(frame.contentWindow.boardDiagnostics)return;await sleep(30);}throw Error('board did not load');}
const state=()=>frame.contentWindow.boardDiagnostics.state();
async function send(c){const r=await fetch('/commands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});if(!r.ok)throw Error(await r.text());return r.json();}
async function done(n){for(let i=0;i<250;i++){if(state().seq>=n&&!state().running)return;await sleep(20);}throw Error('queue timeout '+n);}
try{
 await ready();await done((await send({op:'clear',duration:0})).last);
 const c=await send({op:'create',object:{id:'d',type:'dot',color:'#0088ff'},count:20,arrange:'grid',duration:100,stagger:8});await done(c.last);
 const beforeNode=frame.contentDocument.querySelector('[data-id="d-19"]');
 const sequence=await send([{op:'remove',select:{type:'dot',fraction:.5},duration:130,stagger:25},{op:'set',select:{type:'dot'},props:{color:'#ff0000'},duration:180}]);
 await sleep(170);let s=state();check(Object.keys(s.objects).length>10&&Object.keys(s.objects).length<20,'progressive removal has intermediate object count');check(s.objects['d-19'].color==='#0088ff','survivor remains blue during removal');
 await done(sequence.last);s=state();check(Object.keys(s.objects).length===10,'exactly half removed');check(s.objects['d-19'].color==='#ff0000','survivor recolored after deletion');check(frame.contentDocument.querySelector('[data-id="d-19"]')===beforeNode,'surviving DOM object identity preserved');
 const batch=await send([{op:'create',object:{id:'new',type:'dot',color:'#00ff00'},duration:130},{op:'wait',duration:250},{op:'set',select:'new',props:{color:'#ff0000'},duration:130}]);await sleep(160);check(state().objects.new.color==='#00ff00','earlier create event retains original color');await done(batch.last);
 const g=await send([{op:'group',id:'compound',select:['d-10','d-11'],props:{outline:false}},{op:'move',select:'compound',by:[100,50],duration:300}]);await done(g.last);s=state();check(Math.abs((s.objects['d-11'].x-s.objects['d-10'].x)-45)<.1,'compound preserves member offsets');
 const rejection=await fetch('/commands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([{op:'create',object:{id:'should-not-exist',type:'dot'}},{op:'move',select:'missing',by:[1,2]}])});check(rejection.status===400,'invalid batch rejected');const remote=await (await fetch('/state')).json();check(!remote.objects['should-not-exist'],'invalid batch commits no partial state');
 await done((await send({op:'create',object:{id:'xss',type:'card',title:'<b>t</b>',text:'<img src=x onerror=alert(1)>'}})).last);check(!frame.contentDocument.querySelector('img')&&!frame.contentDocument.querySelector('.text b'),'text remains text, not HTML');
 s=state();check(s.objects['xss/body'].text.startsWith('<img')&&s.objects['xss'].type==='group','card is a group of primitives with stable child ids');
 check(s.boxes['xss'].h>s.boxes['xss/title'].h+s.boxes['xss/body'].h&&Math.abs(s.boxes['xss/bg'].h-s.boxes['xss'].h)<.01,'card hugs its text and the background fills it');
 await done((await send({op:'set',select:'xss',props:{text:'x'.repeat(600)}})).last);const tall=state().boxes['xss'].h;check(tall>s.boxes['xss'].h+40,'parameter change re-expands and the card grows');
 await done((await send({op:'set',select:'xss/body',props:{h:30}})).last);check(state().measured['xss/body'].overflow===true,'fixed text height reports overflow');
 await done((await send({op:'create',object:{id:'tbl',type:'table',x:600,y:0,rows:[['a','b'],['c','d'.repeat(80)]],cols:2,cellW:120}})).last);s=state();check(s.boxes['tbl/cell-1-0'].h===s.boxes['tbl/cell-1-1'].h&&s.boxes['tbl/cell-1-0'].h>s.boxes['tbl/cell-0-0'].h,'table rows are content sized and cells stretch');
 await sleep(1700);const remoteBoxes=(await (await fetch('/state')).json()).objects;check(remoteBoxes['tbl'].box&&typeof remoteBoxes['tbl'].box.h==='number'&&remoteBoxes['xss/body'].measured.overflow===true,'browser-resolved boxes and measurements reach the server');
 const motion=await send([{op:'create',object:{id:'runner',type:'dot',x:0,y:400,body:true},duration:0},{op:'physics',props:{enabled:true,repulsion:0,center:0,damping:1,collision:false}},{op:'impulse',select:'runner',velocity:[150,0]},{op:'wait',duration:250},{op:'physics',props:{enabled:false}},{op:'move',select:'runner',to:[0,400],duration:100}]);await done(motion.last);check(Math.abs(state().objects.runner.x)<.1,'move to unchanged server position still acts after local physics');
 await done((await send({op:'physics',props:{enabled:true}})).last);const x0=state().objects.runner.x;const tint=await send({op:'set',select:'runner',props:{color:'#00ff00'},duration:300});await sleep(140);check(state().objects.runner.x>x0+5,'style animation does not freeze physics');await done(tint.last);await done((await send({op:'physics',props:{enabled:false}})).last);
 const undoBefore=state().objects.new.color;await done((await send({op:'set',select:'new',props:{color:'#111111'}})).last);await done((await send({op:'undo'})).last);check(state().objects.new.color===undoBefore,'undo restores scene');await done((await send({op:'redo'})).last);check(state().objects.new.color==='#111111','redo reapplies scene');
 const countBefore=Object.keys(state().objects).length;frame.src='/';await sleep(200);await ready();check(Object.keys(state().objects).length===countBefore,'reconnect restores snapshot without replaying creation');
 await sleep(50);const final=await (await fetch('/status')).json();check(Object.values(final.receipts).some(r=>Object.values(r).some(v=>v&&typeof v==='object'&&typeof v.firstFrameMs==='number'&&typeof v.doneMs==='number')),'first-frame and completion metrics recorded');
 document.getElementById('results').textContent=results.join('\n')+'\nALL PASS';
 await fetch('/test-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passed:true,results,receipts:final.receipts})});
}catch(e){document.getElementById('results').textContent=results.join('\n')+'\nFAIL '+e.stack;await fetch('/test-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passed:false,results,error:e.stack})});}
</script></body></html>
