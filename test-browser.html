 let drift=0;for(let i=0;i<100;i++){const remoteRoot=(await(await fetch('/state')).json()).objects['mark-root'];drift=state().boxes['mark-root'].ox-remoteRoot.x;if(Math.abs(drift)>18)break;await sleep(20);}
